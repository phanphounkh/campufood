# CampusEats local infrastructure.
#
#   Database only (recommended for development):
#     docker compose up -d db
#
#   Full stack (database + API + web), production-style builds:
#     docker compose --profile full up -d --build
#
name: campuseats

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuseats}
      POSTGRES_USER: ${POSTGRES_USER:-campuseats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuseats} -d ${POSTGRES_DB:-campuseats}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-campuseats}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campuseats}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_PAYMENTS_ENABLED: ${DEMO_PAYMENTS_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUST_PROXY_HEADERS: "true"
      MEDIA_ROOT: /app/media
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:8000
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  media_data:
